[env:esp32dev]
; Pinned to Espressif32 platform 6.5.0 (Arduino-ESP32 Core 2.0.14 LTS)
; Ensures reproducible builds with verified BluetoothSerial and Classic SPP RFCOMM stack
platform = espressif32 @ ~6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -D CORE_DEBUG_LEVEL=0
